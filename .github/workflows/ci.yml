name: ESP32 Firmware CI & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Intensive OTA Code-Analyse
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Führe strikte statische OTA-Prüfungen durch
        run: |
          python -c "
          import sys, re, os

          def strip_comments(text):
              # Entfernt mehrzeilige Kommentare /* ... */
              text = re.sub(r'/\*.*?\*/', '', text, flags=re.DOTALL)
              # Entfernt einzeilige Kommentare // ...
              text = re.sub(r'//.*', '', text)
              return text

          def check_file(filename, check_name, pattern, is_root=False):
              # Wenn is_root True ist (z.B. für platformio.ini), suche im Hauptverzeichnis.
              # Ansonsten suche standardmäßig im src/ Ordner.
              filepath = filename if is_root else os.path.join('src', filename)
              
              try:
                  with open(filepath, 'r', encoding='utf-8') as f:
                      raw_content = f.read()
                      
                      # Kommentare entfernen, damit auskommentierter Code ignoriert wird!
                      clean_content = strip_comments(raw_content)
                      
                      if not re.search(pattern, clean_content, re.MULTILINE | re.DOTALL):
                          print(f'❌ FEHLER: {check_name} in {filepath} fehlt, ist fehlerhaft oder auskommentiert!')
                          print(f'   -> Erwartetes Muster (Regex): {pattern}')
                          sys.exit(1)
                      print(f'✅ {check_name} ({filename})')
              except FileNotFoundError:
                  if is_root:
                      print(f'ℹ️ INFO: Datei {filepath} nicht gefunden (optional).')
                  else:
                      print(f'❌ FEHLER: Datei {filepath} wurde nicht gefunden!')
                      print('   Stelle sicher, dass die Datei im Ordner src/ liegt.')
                      sys.exit(1)
              return True

          print('\n======================================================')
          print('🔍 STARTE EXTENSIVE OTA-SICHERHEITSPRÜFUNGEN')
          print('======================================================\n')

          # --- PRÜFUNGEN: updater.cpp (Frozen Code State) ---
          print('--- Analysiere src/updater.cpp ---')
          check_file('updater.cpp', 'Include Update.h', r'#include\s*<Update\.h>')
          check_file('updater.cpp', 'HTTPS Client initialisiert', r'WiFiClientSecure\s+client')
          check_file('updater.cpp', 'SSL-Zertifikatsprüfung umgangen', r'client\.setInsecure\(\)')
          check_file('updater.cpp', 'Strict Redirects aktiviert', r'http\.setFollowRedirects\(HTTPC_STRICT_FOLLOW_REDIRECTS\)')
          check_file('updater.cpp', 'Authorization Token Header', r'http\.addHeader\(\s*\"Authorization\"')
          check_file('updater.cpp', 'OTA Flash Start', r'Update\.begin\(contentLength\)')
          check_file('updater.cpp', 'Zwingender Neustart', r'ESP\.restart\(\)')

          # --- PRÜFUNGEN: main.cpp (Dynamic Logic State) ---
          print('\n--- Analysiere src/main.cpp ---')
          check_file('main.cpp', 'updater.h Einbindung', r'#include\s*\"updater\.h\"')
          check_file('main.cpp', 'Tageswechsel-Reset Logik', r'day\s*!=\s*lastDay[^}]+ranUpdateToday\s*=\s*false')
          check_file('main.cpp', 'Update-Trigger (Stunde/Minute)', r'hour\s*==\s*\d+\s*&&\s*minute\s*==\s*\d+')
          check_file('main.cpp', 'Loop-Prevention (!ranUpdateToday)', r'!\s*ranUpdateToday')
          check_file('main.cpp', 'Aufruf von updateSystem()', r'updateSystem\s*\(\)')
          check_file('main.cpp', 'Update-Flag Setzung', r'ranUpdateToday\s*=\s*true')

          # --- PRÜFUNGEN: updater.h (Security & Versioning) ---
          print('\n--- Analysiere src/updater.h ---')
          check_file('updater.h', 'Deklaration updateSystem', r'void\s+updateSystem\s*\(\)\s*;')
          check_file('updater.h', 'Version-Format Validierung (SemVer, z.B. 1.0.0)', r'CURRENT_VERSION\s*=\s*\"\d+\.\d+\.\d+\"')
          check_file('updater.h', 'GitHub User gesetzt', r'GITHUB_USER\s*=\s*\".+\"')
          check_file('updater.h', 'GitHub Repo gesetzt', r'GITHUB_REPO\s*=\s*\".+\"')
          
          # Sicherheits-Check: Wirft einen Fehler, wenn das Token mit 'github_pat_' anfängt. 
          # Verhindert, dass echte Tokens in das Repository gepusht werden.
          check_file('updater.h', 'Token-Sicherheitscheck (Kein Klartext-PAT)', r'GITHUB_TOKEN\s*=\s*\"(?!github_pat_).*\"')

          # --- PRÜFUNGEN: platformio.ini (Ressourcen) ---
          print('\n--- Analysiere platformio.ini ---')
          try:
              with open('platformio.ini', 'r', encoding='utf-8') as f:
                  content = strip_comments(f.read())
                  if not re.search(r'board_build\.partitions\s*=|partitions\s*=', content):
                      print('❌ Keine expliziten Partitionen in platformio.ini definiert.')
                      print('   Das Standard-Limit ist ca. 1.2MB, was künftig zu OTA-Fehlern führen kann!')
                      sys.exit(1)
                  else:
                      print('✅ Eigene Partitions-Konfiguration gefunden (platformio.ini)')
          except Exception as e:
              print(f'❌ Konnte platformio.ini nicht prüfen: {e}')
              sys.exit(1)

          print('\n======================================================')
          print('✅✅ ALLE PRÜFUNGEN ERFOLGREICH BESTANDEN! ✅✅')
          print('======================================================\n')
          "

  build_and_release:
    name: Build & Release
    needs: validate # Dieser Job startet NUR, wenn 'validate' fehlerfrei durchlief
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' # Kein Release bei PRs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO Build
        run: pio run
        # Wenn der Build hier fehlschlägt, bricht der Workflow ab und es gibt kein Release.

      - name: Generate Version Tag
        id: vars
        run: echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Set date
        id: date
        run: echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Departure Screen Update ${{ steps.vars.outputs.tag }}
          body: |
            Automatisch generierter Build des ESP32 Departure Screens.
            Datum: ${{ steps.date.outputs.date }}
            ✅ Statische Code-Analyse bestanden
            ✅ Build erfolgreich
          draft: false
          prerelease: false
          files: .pio/build/*/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}