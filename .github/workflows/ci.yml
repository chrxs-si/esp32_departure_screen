name: ESP32 Firmware CI & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Intensive OTA Code-Analyse
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Führe strikte statische OTA-Prüfungen durch
        run: |
          python -c "
          import sys, re

          def check_file(filename, check_name, pattern, optional=False):
              try:
                  with open(filename, 'r', encoding='utf-8') as f:
                      content = f.read()
                      if not re.search(pattern, content, re.MULTILINE | re.DOTALL):
                          if optional:
                              print(f'⚠️ WARNUNG: {check_name} in {filename} nicht gefunden (optional).')
                              return
                          else:
                              print(f'❌ FEHLER: {check_name} in {filename} fehlt!')
                              print(f'   -> Gesucht wurde nach Regex: {pattern}')
                              sys.exit(1)
                      print(f'✅ {check_name}')
              except FileNotFoundError:
                  print(f'❌ FEHLER: Datei {filename} wurde nicht gefunden.')
                  sys.exit(1)

          print('\n======================================================')
          print('OTA-SICHERHEITSPRÜFUNGEN')
          print('======================================================\n')

          # --- PRÜFUNGEN: updater.cpp ---
          print('--- Analysiere updater.cpp (Frozen Code State) ---')
          
          # 1. Bibliotheken
          check_file('updater.cpp', 'Include Update.h', r'#include\s*<Update\.h>')
          check_file('updater.cpp', 'Include HTTPClient.h', r'#include\s*<HTTPClient\.h>')
          check_file('updater.cpp', 'Include WiFiClientSecure.h', r'#include\s*<WiFiClientSecure\.h>')
          check_file('updater.cpp', 'Include ArduinoJson.h', r'#include\s*<ArduinoJson\.h>')
          
          # 2. Verbindung & Security (HTTPS)
          check_file('updater.cpp', 'HTTPS Client initialisiert', r'WiFiClientSecure\s+client')
          check_file('updater.cpp', 'SSL-Zertifikatsprüfung umgangen', r'client\.setInsecure\(\)')
          check_file('updater.cpp', 'Strict Redirects aktiviert (GitHub AWS Links)', r'http\.setFollowRedirects\(HTTPC_STRICT_FOLLOW_REDIRECTS\)')
          
          # 3. HTTP Header (Zwingend für GitHub API & Private Repos)
          check_file('updater.cpp', 'User-Agent Header vorhanden', r'http\.addHeader\(\s*\"User-Agent\"')
          check_file('updater.cpp', 'Authorization Token übergeben', r'http\.addHeader\(\s*\"Authorization\",\s*\"token\s*\"\s*\+\s*GITHUB_TOKEN\)')
          check_file('updater.cpp', 'Accept Header für Binärdaten gesetzt', r'http\.addHeader\(\s*\"Accept\",\s*\"application/octet-stream\"\)')
          
          # 4. JSON Parsing & Asset Identifikation
          check_file('updater.cpp', 'JSON Deserialization verwendet', r'deserializeJson')
          check_file('updater.cpp', 'Sucht gezielt nach .bin Dateien', r'\.endsWith\(\s*\"\.bin\"\s*\)')
          
          # 5. Download & Dateigröße
          check_file('updater.cpp', 'HTTP GET Aufruf', r'http\.GET\(\)')
          check_file('updater.cpp', 'Dateigröße wird ermittelt', r'http\.getSize\(\)')
          check_file('updater.cpp', 'Prüfung auf ungültige Dateigröße (<= 0)', r'contentLength\s*<=\s*0')
          
          # 6. OTA Flash-Prozess (Core Update Logic)
          check_file('updater.cpp', 'OTA Flash Start & Speicherprüfung', r'Update\.begin\(contentLength\)')
          check_file('updater.cpp', 'Stream wird in Flash geschrieben', r'Update\.writeStream\(')
          check_file('updater.cpp', 'OTA Flash Endsequenz aufgerufen', r'Update\.end\(\)')
          check_file('updater.cpp', 'OTA Flash Integritätsprüfung', r'Update\.isFinished\(\)')
          
          # 7. Aufräumen & Neustart
          check_file('updater.cpp', 'HTTP Client wird geschlossen', r'http\.end\(\)')
          check_file('updater.cpp', 'Zwingender Neustart nach Update', r'ESP\.restart\(\)')


          # --- PRÜFUNGEN: main.cpp ---
          print('\n--- Analysiere main.cpp (Dynamic Logic State) ---')
          
          check_file('main.cpp', 'updater.h ist eingebunden', r'#include\s*\"updater\.h\"')
          
          # Globale Variablen für den Schutzmechanismus
          check_file('main.cpp', 'Globale Variable ranUpdateToday definiert', r'bool\s+ranUpdateToday')
          check_file('main.cpp', 'Globale Variable lastDay definiert', r'int\s+lastDay')
          
          # Tageswechsel-Reset (Verhindert, dass das Update am Folgetag blockiert ist)
          check_file('main.cpp', 'Tägliches Reset-Flag (day != lastDay => ranUpdateToday = false)', r'day\s*!=\s*lastDay[^}]+ranUpdateToday\s*=\s*false')
          
          # Zeitgesteuerter Trigger & Loop-Prevention
          check_file('main.cpp', 'Zeitprüfung vorhanden (hour & minute)', r'hour\s*==\s*\d+\s*&&\s*minute\s*==\s*\d+')
          check_file('main.cpp', 'Loop-Prevention: !ranUpdateToday wird vor Update geprüft', r'!\s*ranUpdateToday')
          check_file('main.cpp', 'Aufruf von updateSystem() vorhanden', r'updateSystem\s*\(\)')
          
          # Prüfung, ob das Flag VOR/WÄHREND dem Update auf true gesetzt wird (sonst Endlosschleife falls updateSystem fehlschlägt aber nicht restartet)
          check_file('main.cpp', 'Update-Flag wird auf true gesetzt (ranUpdateToday = true)', r'ranUpdateToday\s*=\s*true')


          # --- PRÜFUNGEN: updater.h ---
          print('\n--- Analysiere updater.h ---')
          check_file('updater.h', 'Funktion updateSystem() ist deklariert', r'void\s+updateSystem\s*\(\)\s*;')
          check_file('updater.h', 'Konstante CURRENT_VERSION vorhanden', r'const\s+String\s+CURRENT_VERSION')
          check_file('updater.h', 'Konstante GITHUB_USER vorhanden', r'const\s+String\s+GITHUB_USER')
          check_file('updater.h', 'Konstante GITHUB_REPO vorhanden', r'const\s+String\s+GITHUB_REPO')
          check_file('updater.h', 'Konstante GITHUB_TOKEN vorhanden', r'const\s+String\s+GITHUB_TOKEN')

          print('\n======================================================')
          print('✅ PRÜFUNGEN ERFOLGREICH BESTANDEN! ✅')
          print('======================================================\n')
          "

  build_and_release:
    name: Build & Release
    needs: validate # Dieser Job startet NUR, wenn 'validate' fehlerfrei durchlief
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' # Kein Release bei PRs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO Build
        run: pio run
        # Wenn der Build hier fehlschlägt, bricht der Workflow ab und es gibt kein Release.

      - name: Generate Version Tag
        id: vars
        run: echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Set date
        id: date
        run: echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Departure Screen Update ${{ steps.vars.outputs.tag }}
          body: |
            Automatisch generierter Build des ESP32 Departure Screens.
            Datum: ${{ steps.date.outputs.date }}
            ✅ Statische Code-Analyse bestanden
            ✅ Build erfolgreich
          draft: false
          prerelease: false
          files: .pio/build/*/firmware.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}